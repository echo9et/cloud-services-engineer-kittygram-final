name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select the Terraform action'
        type: choice
        required: true
        default: 'plan'
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_token: ${{ secrets.YC_IAM_TOKEN }}
      TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
      TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
      TF_VAR_zone: ${{ secrets.YC_ZONE }}
      TF_VAR_ssh_key: ${{ secrets.SERVER_SSH_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
            
      - name: Terraform Init
        working-directory: ./infra
        run: terraform init -input=false
      
      - name: Terraform Validate
        working-directory: ./infra
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./infra
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: |
          terraform init -input=false -reconfigure \
          -backend-config="access_key=${AWS_ACCESS_KEY_ID}" \
          -backend-config="secret_key=${AWS_SECRET_ACCESS_KEY}"
      
      - name: Terraform Apply
        working-directory: ./infra
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false
      
      - name: Terraform Destroy
        working-directory: ./infra
        if: github.event.inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
      